<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>착착 - 로그인 처리 중</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .container {
            text-align: center;
            padding: 2rem;
        }
        .logo {
            width: 100px;
            height: 100px;
            margin: 0 auto 2rem;
            background: white;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
        }
        .spinner {
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top: 3px solid white;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .message {
            font-size: 18px;
            margin-top: 20px;
        }
        .sub-message {
            font-size: 14px;
            margin-top: 10px;
            opacity: 0.8;
        }
        .error {
            background: #ff4444;
            padding: 1rem;
            border-radius: 8px;
            margin-top: 20px;
        }
        .button {
            background: white;
            color: #667eea;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;
            text-decoration: none;
            display: inline-block;
        }
        .button:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">💳</div>
        <div class="spinner"></div>
        <div class="message">로그인 처리 중입니다...</div>
        <div class="sub-message">잠시만 기다려주세요</div>
        <div id="error-container"></div>
    </div>

    <script>
        // URL 파라미터 파싱
        const urlParams = new URLSearchParams(window.location.search);
        const code = urlParams.get('code');
        const error = urlParams.get('error');
        const state = urlParams.get('state');
        
        console.log('OAuth Callback:', { code, error, state });
        
        // 카카오 네이티브 앱 키 기반 URL 스킴
        const KAKAO_NATIVE_APP_KEY = '6b016d71ce5ad1c2b457a87013388800';
        const URL_SCHEME = `kakao${KAKAO_NATIVE_APP_KEY}://oauth`;

        if (error) {
            // 에러 처리 - WebBrowser에서 URL 파라미터로 캐치할 수 있도록 URL만 변경
            document.querySelector('.message').innerHTML = `로그인 중 오류가 발생했습니다.`;
            document.querySelector('.sub-message').innerHTML = `오류: ${error}`;

            // WebBrowser가 캐치할 수 있도록 현재 URL에 에러 정보 추가
            const newUrl = `${window.location.origin}${window.location.pathname}?error=${error}`;
            window.history.replaceState({}, '', newUrl);
        } else if (code) {
            // 성공 - WebBrowser가 URL에서 code를 읽을 수 있도록 단순히 표시만 함
            document.querySelector('.message').innerHTML = `로그인 성공!`;
            document.querySelector('.sub-message').innerHTML = `인증이 완료되었습니다. 앱으로 돌아갑니다...`;

            // WebBrowser가 캐치할 수 있도록 현재 URL에 코드 정보 추가
            const newUrl = `${window.location.origin}${window.location.pathname}?code=${code}&state=${state || ''}`;
            window.history.replaceState({}, '', newUrl);

            // 시각적 피드백 제공
            document.querySelector('.spinner').style.borderTopColor = '#4CAF50';

            console.log('OAuth success, WebBrowser should capture the URL with code:', code);

            // 강제로 WebBrowser를 닫아서 앱으로 돌아가기 (3초 후)
            setTimeout(() => {
                try {
                    // WebBrowser close 시도
                    window.ReactNativeWebView?.postMessage(JSON.stringify({
                        type: 'OAUTH_SUCCESS',
                        code: code,
                        state: state
                    }));
                } catch (e) {
                    console.log('WebView 메시지 전송 실패, 일반 브라우저일 수 있음');
                }

                // URL 변경으로 WebBrowser가 감지하도록 시도
                window.location.href = `exp://close?code=${code}&state=${state}`;
            }, 2000);
        } else {
            // 파라미터가 없는 경우
            document.querySelector('.message').innerHTML = `잘못된 요청입니다.`;
            document.querySelector('.sub-message').innerHTML = `올바른 파라미터를 받지 못했습니다.`;

            // WebBrowser가 캐치할 수 있도록 현재 URL에 에러 정보 추가
            const newUrl = `${window.location.origin}${window.location.pathname}?error=no_code_received`;
            window.history.replaceState({}, '', newUrl);
        }
    </script>
</body>
</html>
